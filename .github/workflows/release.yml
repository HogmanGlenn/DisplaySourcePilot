name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\DisplaySourcePilot.App\DisplaySourcePilot.App.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match application version $version."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build release
        shell: pwsh
        run: .\build\Build-Release.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = Get-Item -LiteralPath ".\artifacts\installer\DisplaySourcePilot-Setup-$version.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content .\artifacts\installer\SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = Get-Item -LiteralPath ".\artifacts\installer\DisplaySourcePilot-Setup-$version.exe"
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            .\artifacts\installer\SHA256SUMS.txt `
            --draft `
            --generate-notes `
            --title "DisplaySourcePilot $version" `
            --verify-tag
